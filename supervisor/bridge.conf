[program:bridge]
command=/app/scripts/start-bridge.sh
user=bott
environment=HOME="/data/bridge",GNUPGHOME="/data/bridge/.gnupg",PASSWORD_STORE_DIR="/data/bridge/.password-store",XDG_CONFIG_HOME="/data/bridge/.config",XDG_CACHE_HOME="/data/bridge/.cache",XDG_DATA_HOME="/data/bridge/.local/share"
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=10
stdout_logfile=/data/logs/bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/bridge.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
