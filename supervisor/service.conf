[program:service]
command=/app/scripts/start-service.sh
user=bott
directory=/app
environment=HOME="/data/bridge"
autostart=true
autorestart=true
startsecs=5
startretries=5
; Start after Bridge has had a moment to bind its localhost IMAP port.
priority=20
stdout_logfile=/data/logs/service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/service.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
