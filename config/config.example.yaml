# bott-mail-service configuration (Phase 1, read-only).
# Sensitive values are referenced by ENV VAR NAME so secrets never live here.

server:
  host: 0.0.0.0
  port: 8080

auth:
  tokens:
    - id: hermes-read
      token_env: BOTT_MAIL_HERMES_READ_TOKEN
      scopes:
        - sync:run
        - messages:search
        - messages:read
    - id: archive-worker
      token_env: BOTT_MAIL_ARCHIVE_TOKEN
      scopes:
        - messages:archive
    - id: hermes-automation
      token_env: BOTT_MAIL_AUTOMATION_TOKEN
      scopes:
        - automation:recommend
        - automation:classify

hermes:
  # Example: http://hermes:8644/webhooks/mail-classify
  webhook_url: ""
  webhook_secret_env: BOTT_MAIL_HERMES_WEBHOOK_SECRET
  webhook_timeout_seconds: 10

imap:
  host_env: PROTON_BRIDGE_IMAP_HOST
  port_env: PROTON_BRIDGE_IMAP_PORT
  username_env: PROTON_BRIDGE_IMAP_USERNAME
  password_env: PROTON_BRIDGE_IMAP_PASSWORD
  tls: false

sync:
  default_days: 30
  folders:
    - INBOX
  exclude_folders:
    - Trash
    - Spam
    - Sent
    - Drafts
    - All Mail
  # Background sync worker.
  #   mode: idle  -> IMAP IDLE push (near-instant new mail) + periodic refresh
  #   mode: poll  -> simple periodic incremental sync
  # interval_minutes is the refresh/poll cadence (also the IDLE keepalive).
  # 0 disables the background worker entirely.
  mode: idle
  interval_minutes: 5
  idle_folders:
    - INBOX

storage:
  sqlite_path: /data/data/mail.sqlite
  audit_log: /data/data/audit.log

safety:
  allow_send: false
  allow_delete: false
  allow_archive: false
  allow_label: false
  archive_folder: Archive
  expose_raw_html: false
  max_body_chars: 12000
  max_results: 25
  max_sync_days: 365
